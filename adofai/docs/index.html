<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ADOFAI 源码文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="A Dance of Fire and Ice 源码结构与 API 文档">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">正在加载文档...</div>
  <script>
    window.$docsify = {
      name: 'ADOFAI 源码文档',
      repo: 'https://github.com/memsys-lizi/7thRhythmDocuments',
      homepage: 'home.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档',
        noData: '没有找到结果',
        depth: 6
      },
      markdown: {
        smartypants: false
      }
    };
    window.ADOFAI_AI = {
      endpoint: '',
      port: '1970',
      game: 'adofai'
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      themeVariables: {
        primaryColor: '#ffffff',
        primaryTextColor: '#111111',
        primaryBorderColor: '#111111',
        lineColor: '#111111',
        secondaryColor: '#f4f4f4',
        tertiaryColor: '#ffffff'
      }
    });
  </script>
  <script src="ai-assistant.js"></script>

</html>
